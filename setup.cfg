[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    env,
    build,
    dist,
    *.egg-info,
    .mypy_cache,
    .pytest_cache,
    node_modules

[black]
line-length = 88
target-version = py312
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | env
    | build
    | dist
    | \.egg-info
    | \.mypy_cache
    | \.pytest_cache
    | node_modules
)/
'''
